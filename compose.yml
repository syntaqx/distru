services:
  postgres:
    # Postgres 18: our time-ordered UUIDv7 keys get better B-tree/index locality
    # here (and PG18 ships a native uuidv7()). NOTE: a major-version bump can't
    # read an existing v16 data dir - if the container errors on an old volume,
    # reset it: `docker compose down -v` (drops the demo data, which reseeds).
    image: postgres:18-alpine
    container_name: distru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: distru
      POSTGRES_PASSWORD: distru
      POSTGRES_DB: distru
    ports:
      - "5432:5432"
    volumes:
      # PG18's image stores data in a major-version subdir, so the mount is the
      # parent `/var/lib/postgresql` (NOT `/var/lib/postgresql/data` as on <=17).
      - distru-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distru -d distru"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: distru-app
    depends_on:
      postgres:
        condition: service_healthy
    # Pulls ANTHROPIC_API_KEY, BETTER_AUTH_SECRET, etc. from your .env,
    # then overrides DATABASE_URL below to reach Postgres over the compose network.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://distru:distru@postgres:5432/distru
      NODE_ENV: development
      # The /docs page compiles Shiki (WASM grammars/themes) + Mermaid under the
      # webpack dev server, which blows past Node's default ~2GB heap and OOMs.
      # Give the dev server room so recompiles don't crash the container.
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Poll for file changes so live reload works across bind mounts (Windows/WSL2).
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app # your source, bind-mounted for live reload
      - /app/node_modules # keep the image's Linux node_modules (don't clobber with host's)
      - /app/.next # keep the build cache inside the container
    # Create the schema, seed the demo tenant (both idempotent), then dev with HMR.
    # Uses --webpack because webpack honors WATCHPACK_POLLING, which is what makes
    # hot reload fire over a bind mount on Windows/WSL2 (Turbopack ignores polling).
    command: sh -c "npm run build:docs && npm run maplibre:worker && npm run db:push && npm run db:seed && npx next dev --webpack -H 0.0.0.0 -p 3000"
    # Real readiness: /readyz returns 200 only once Next has booted AND Postgres
    # is reachable (it runs `select 1`). Because the command below builds docs,
    # pushes schema, and seeds BEFORE `next dev` starts, /readyz stays
    # unreachable until all of that is done - so "healthy" means genuinely ready
    # to serve, not just "node started". `start_period` keeps early failures from
    # counting against the retry budget while it boots.
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  distru-pgdata:
