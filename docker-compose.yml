services:
  postgres:
    image: postgres:16-alpine
    container_name: distru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: distru
      POSTGRES_PASSWORD: distru
      POSTGRES_DB: distru
    ports:
      - "5432:5432"
    volumes:
      - distru-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distru -d distru"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  distru-pgdata:
